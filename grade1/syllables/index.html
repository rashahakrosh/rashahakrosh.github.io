function playDeletionVoice(which){playSource(deletionVoices[which]);}
function playPraise(i){playSource(praiseClips[i]);}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function home(){stopAudio();$('game').classList.add('hidden');$('home').classList.remove('hidden');$('menu').innerHTML=games.map((g,i)=>`<button class="tile" onclick="start(${i})">${g.emoji} ${g.title}<small>اضغطوا للبدء</small><span class="best">${starText(getBest(i))}</span></button>`).join('')}
function start(i){current=i;round=0;score=0;mistakes=0;const removeGame=['remove1','removeLast'].includes(games[i].type);items=shuffle(removeGame?DATA.filter(x=>x.p[0]!==x.p[1]):DATA).slice(0,6);if(games[i].type==='sounds')items=shuffle(SOUNDS).slice(0,6);if(games[i].type==='letters')items=shuffle(['دا','دو','دي','را','رو','ري','وا','وي','يا','يو','يي']).slice(0,6).map(w=>({w,letters:[...w]}));$('home').classList.add('hidden');$('game').classList.remove('hidden');render();playInstruction()}
function options(correct,pool){return shuffle([correct,...shuffle([...new Set(pool)].filter(x=>x!==correct)).slice(0,3)])}
function render(){if(['remove1','removeLast'].includes(games[current].type) && items[round] && items[round].p[0]===items[round].p[1]){items=items.filter(x=>x.p[0]!==x.p[1]);if(round>=items.length)round=0;}locked=false;selected=[];used=[];let g=games[current],q=items[round];$('gameTitle').textContent=g.title;$('progress').textContent=`السؤال ${round+1} من ${items.length}`;$('score').textContent=`⭐ ${score} نقطة`;$('fill').style.width=(round/items.length*100)+'%';$('feedback').textContent='';$('next').style.display='none';$('chosen').classList.add('hidden');$('chosen').textContent='';$('undo').style.display='none';$('word').textContent=q.w;let pool=DATA.flatMap(x=>x.p),opts=[];mode=g.type;
if(mode==='build'){target=q.p;opts=shuffle([...q.p,distract(q.p,pool)]);$('instruction').textContent='اضغطوا على المقطعين بالترتيب لتكوين الكلمة';}
else if(mode==='split'){target=q.p;opts=shuffle([...q.p,distract(q.p,pool)]);$('instruction').textContent='اختاروا مقاطع الكلمة بالترتيب';}
else if(mode==='sounds'){target=q.sounds;opts=shuffle([...q.sounds,distract(q.sounds,LETTERS)]);$('instruction').textContent='اختاروا الأصوات بالترتيب';}
else if(mode==='letters'){target=q.letters;opts=shuffle([...q.letters,distract(q.letters,LETTERS)]);$('instruction').textContent='رتّبوا الحروف لتكوين المقطع';}
else if(mode==='missing'){let missing=round%2;answer=q.p[missing];$('word').textContent=q.w;$('instruction').textContent=missing===0?`ما المقطع الأول الناقص في «${q.w}»؟`:`ما المقطع الثاني الناقص في «${q.w}»؟`;opts=options(answer,pool);}
else{answer=mode==='remove1'?q.p[0]:q.p[1];$('word').textContent=q.w;$('instruction').textContent=mode==='remove1'?'احذفوا المقطع الأول من الكلمة. اختاروا المقطع الذي نحذفه.':'احذفوا المقطع الأخير من الكلمة. اختاروا المقطع الذي نحذفه.';opts=options(answer,pool)}
const sequence=['build','split','sounds','letters'].includes(mode);if(sequence){$('chosen').classList.remove('hidden');$('undo').style.display='inline-block'}$('choices').innerHTML='';opts.forEach((v,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=v;b.onclick=()=>{if(locked||used.includes(i))return;if(sequence){used.push(i);selected.push(v);b.disabled=true;b.style.opacity='.4';$('chosen').textContent=selected.join('  ');if(selected.length===target.length)check(JSON.stringify(selected)===JSON.stringify(target));}else{const ok=v===answer;b.classList.remove('wrong');void b.offsetWidth;b.classList.add(ok?'right':'wrong');check(ok);}};$('choices').appendChild(b)});window.undo=()=>{if(locked||!used.length)return;used.pop();selected.pop();let bs=$('choices').children;for(let j=0;j<bs.length;j++){bs[j].disabled=used.includes(j);bs[j].style.opacity=used.includes(j)?'.4':'1'}$('chosen').textContent=selected.join('  ')};}
function check(ok){if(ok){locked=true;score+=10;const pi=feedbackIndex++%praiseLabels.length;$('feedback').textContent='🌟 '+praiseLabels[pi]+'!';playPraise(pi);celebrate();$('next').style.display='inline-block';$('next').textContent=round===items.length-1?'النتيجة 🏆':'السؤال التالي ←';}else{mistakes++;$('feedback').textContent='💗 حاول مرة أخرى يا بطل';play(9);const ch=$('chosen');ch.classList.remove('wrong');void ch.offsetWidth;ch.classList.add('wrong');setTimeout(()=>ch.classList.remove('wrong'),450);if(['build','split','sounds','letters'].includes(mode)){selected=[];used=[];$('chosen').textContent='';Array.from($('choices').children).forEach(b=>{b.disabled=false;b.style.opacity='1'})}}$('score').textContent=`⭐ ${score} نقطة`}
function next(){round++;if(round>=items.length){$('progress').textContent='انتهت المغامرة';$('fill').style.width='100%';$('gameTitle').textContent='🏆 رائع!';$('instruction').textContent='لقد أنهيت اللعبة بنجاح';$('word').textContent=score+' / '+(items.length*10);$('choices').innerHTML='';$('chosen').classList.add('hidden');$('undo').style.display='none';$('next').style.display='none';const st=mistakes<=1?3:mistakes<=4?2:1;setBest(current,st);$('word').innerHTML='<div class="stars">'+starText(st)+'</div>'+score+' / '+(items.length*10);$('feedback').textContent='🌷 اختر لعبة أخرى لتكمل المغامرة';$('choices').innerHTML='<button class="btn" onclick="start(current)">🔁 العبوا مرة أخرى</button>';play(10);return}render()}
function distract(target,pool){const c=[...new Set(pool)].filter(x=>!target.includes(x));return c[Math.floor(Math.random()*c.length)]}
function starText(n){return n?'⭐'.repeat(n)+'☆'.repeat(3-n):''}
function getBest(i){try{return +localStorage.getItem('g1a_best_'+i)||0}catch(e){return 0}}
function setBest(i,n){try{if(n>getBest(i))localStorage.setItem('g1a_best_'+i,n)}catch(e){}}
function celebrate(){if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;const em=['⭐','🌟','🎉','🌈','💖'];const cx=innerWidth/2,cy=innerHeight/2;for(let k=0;k<12;k++){const s=document.createElement('span');s.className='burst';s.textContent=em[k%em.length];s.style.left=cx+'px';s.style.top=cy+'px';const a=Math.PI*2*k/12;s.style.setProperty('--x',Math.cos(a)*(120+Math.random()*60)+'px');s.style.setProperty('--y',Math.sin(a)*(120+Math.random()*60)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}}
home();
